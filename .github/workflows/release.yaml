# Modified for shiorico: validate source, licenses, and all assets before publishing.
name: Release

on:
  workflow_dispatch:
    inputs:
      core_only:
        type: boolean
        description: Build only core binaries (omit linked FFmpeg editions)
        default: false
      publish:
        type: boolean
        description: Publish the validated draft and then update the version index
        default: false

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      core_only: ${{ inputs.core_only }}
    secrets: inherit

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the complete pinned dependency graph
        run: cargo fetch --locked
      - name: Fetch pinned FFmpeg source
        if: inputs.core_only == false
        run: |
          revision=$(tr -d '[:space:]' < .versions/ffmpeg)
          git init target/source-native/ffmpeg
          git -C target/source-native/ffmpeg remote add origin https://github.com/FFmpeg/FFmpeg.git
          git -C target/source-native/ffmpeg fetch --depth=1 origin "$revision"
          git -C target/source-native/ffmpeg checkout --detach FETCH_HEAD
          test "$(git -C target/source-native/ffmpeg rev-parse HEAD)" = "$revision"
      - name: Package complete corresponding source
        env:
          CORE_ONLY: ${{ inputs.core_only }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("bin/shiori/Cargo.toml", "rb"))["package"]["version"])')
          native_source=()
          if [[ "$CORE_ONLY" == false ]]; then native_source=(--ffmpeg-source target/source-native/ffmpeg); fi
          python3 scripts/package-release.py source --version "$version" "${native_source[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: shiorico-source
          path: dist/release/
          if-no-files-found: error

  release:
    needs: [build, source]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: shiorico-*
          path: dist/release
          merge-multiple: true
      - name: Validate complete release materials
        id: release
        env:
          CORE_ONLY: ${{ inputs.core_only }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("bin/shiori/Cargo.toml", "rb"))["package"]["version"])')
          variants=(core ffmpeg)
          if [[ "$CORE_ONLY" == true ]]; then variants=(core); fi
          python3 scripts/validate-release.py dist/release --version "$version" --variants "${variants[@]}"
          echo "tag=shiorico-v$version" >> "$GITHUB_OUTPUT"
      - name: Stage a draft with all validated materials
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('target').mkdir(exist_ok=True)
          Path('target/release-notes.md').write_text(
              'Independently maintained continuation of iori / Shiori.\n\n'
              'Binary archives contain licenses, native build information, and a link to the '
              'corresponding source archive. The source archive includes Cargo dependencies, '
              'Bento4, and FFmpeg source when linked. Verify files against SHA256SUMS.\n\n'
              'Inherited components retain their original licenses. The combined application '
              'is distributed under GPL-3.0-or-later; see LICENSING.md in the archives.\n'
          )
          PY
          gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" --notes-file target/release-notes.md
          assets=(dist/release/*.tar.gz dist/release/*.zip dist/release/SHA256SUMS)
          gh release upload "$RELEASE_TAG" "${assets[@]}"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > target/uploaded-assets.txt
          python3 - <<'PY'
          from pathlib import Path
          root = Path('dist/release')
          expected = {p.name for p in root.iterdir() if p.suffix in {'.gz', '.zip'} or p.name == 'SHA256SUMS'}
          actual = set(Path('target/uploaded-assets.txt').read_text().splitlines())
          assert expected == actual, f'Release assets differ: missing={expected-actual}, extra={actual-expected}'
          PY
      - name: Publish the validated draft
        if: inputs.publish == true
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Update the version index after publication
        if: inputs.publish == true
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('.versions/shiorico')
          text = path.read_text()
          tag = os.environ['RELEASE_TAG']
          if tag not in text.splitlines():
              path.write_text(text.rstrip() + '\n' + tag + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .versions/shiorico
          if ! git diff --cached --quiet; then
            git commit -m "记录 shiorico 已发布版本 $RELEASE_TAG"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
