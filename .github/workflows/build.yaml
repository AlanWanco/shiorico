# Modified for shiorico: each target/variant builds and packages independently.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      core_only:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.variant }} / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.core_only && '["core"]' || '["core","ffmpeg"]') }}
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-gnu
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      SHIORICO_BUILD_COMMIT: ${{ github.sha }}
      SHIORICO_LOCAL_EPLUS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - name: Install native tools [Linux]
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake pkg-config nasm clang
          if [[ '${{ matrix.target }}' == x86_64-pc-windows-gnu ]]; then
            sudo apt-get install -y mingw-w64
          fi
      - name: Install native tools [macOS]
        if: runner.os == 'macOS'
        run: brew install nasm pkg-config cmake
      - name: Test public Eplus playback policy
        if: matrix.variant == 'core' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --locked -p shiori-plugin-eplus
      - name: Build pinned FFmpeg and retain configuration
        if: matrix.variant == 'ffmpeg'
        run: bash scripts/build-ffmpeg.sh '${{ matrix.target }}'
      - name: Build shiorico
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VARIANT: ${{ matrix.variant }}
        run: |
          features=()
          if [[ "$RELEASE_VARIANT" == ffmpeg ]]; then features=(--features ffmpeg); fi
          cargo build --release --locked -p shiorico --target "$RELEASE_TARGET" "${features[@]}"
          cargo fetch --locked
      - name: Smoke test native executable
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          target/${{ matrix.target }}/release/shiorico --version
          target/${{ matrix.target }}/release/shiorico --help
      - name: Verify Windows executable format
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          x86_64-w64-mingw32-objdump -f target/x86_64-pc-windows-gnu/release/shiorico.exe | grep 'file format pei-x86-64' >/dev/null
      - name: Package binary and license notices
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VARIANT: ${{ matrix.variant }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("bin/shiori/Cargo.toml", "rb"))["package"]["version"])')
          native_info=()
          if [[ "$RELEASE_VARIANT" == ffmpeg ]]; then native_info=(--ffmpeg-info "$SHIORICO_FFMPEG_INFO"); fi
          python3 scripts/package-release.py binary --version "$version" --target "$RELEASE_TARGET" \
            --variant "$RELEASE_VARIANT" "${native_info[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: shiorico-${{ matrix.variant }}-${{ matrix.target }}
          path: dist/release/
          if-no-files-found: error
